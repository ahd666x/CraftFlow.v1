{% extends 'storefront/layouts/store.html' %}

{% block title %}بازیابی رمز عبور — فروشگاه{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-8">
    <div class="card p-6">
        <h1 class="mb-2 text-center text-xl font-bold">بازیابی رمز عبور</h1>
        <p class="mb-6 text-center text-sm text-stone-500">ایمیل حساب خود را وارد کنید.</p>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="{{ form.email.id_for_label }}" class="label">ایمیل</label>
                {{ form.email }}
            </div>
            <button type="submit" class="btn-primary w-full py-3">ارسال لینک بازیابی</button>
        </form>

        <div class="mt-6 text-center text-sm">
            <a href="{% url 'accounts:login' %}" class="text-primary-600 hover:underline">بازگشت به ورود</a>
        </div>
    </div>
</div>
{% endblock %}
