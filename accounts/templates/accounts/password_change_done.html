{% extends 'storefront/layouts/store.html' %}

{% block title %}کلمه عبور تغییر کرد — فروشگاه{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-8">
    <div class="card p-6 text-center">
        <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-emerald-50">
            <svg class="h-8 w-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
            </svg>
        </div>
        <h1 class="mt-4 text-xl font-bold">کلمه عبور شما با موفقیت تغییر کرد</h1>
        <p class="mt-2 text-sm text-stone-500">از این پس برای ورود باید از کلمه عبور جدید استفاده کنید.</p>

        <div class="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{% url 'accounts:profile' %}" class="btn-primary px-6 py-2.5">بازگشت به پروفایل</a>
            <a href="{% url 'storefront:home' %}" class="btn-outline px-6 py-2.5">فروشگاه</a>
        </div>
    </div>
</div>
{% endblock %}
