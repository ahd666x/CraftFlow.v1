{% extends 'storefront/layouts/store.html' %}

{% block title %}تکمیل بازیابی رمز عبور{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-8">
    <div class="card p-6">
        <h1 class="mb-6 text-center text-xl font-bold">تکمیل بازیابی رمز عبور</h1>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="{{ form.new_password1.id_for_label }}" class="label">کلمه عبور جدید</label>
                {{ form.new_password1 }}
            </div>
            <div>
                <label for="{{ form.new_password2.id_for_label }}" class="label">تکرار کلمه عبور جدید</label>
                {{ form.new_password2 }}
            </div>
            <button type="submit" class="btn-primary w-full py-3">ذخیره رمز عبور جدید</button>
        </form>
    </div>
</div>
{% endblock %}
