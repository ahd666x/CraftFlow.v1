{% extends 'storefront/layouts/store.html' %}

{% block title %}درخواست مرجوعی — فروشگاه{% endblock %}

{% block content %}
<div class="mx-auto max-w-2xl px-4 py-8">
    <h1 class="mb-6 text-2xl font-bold">درخواست مرجوعی</h1>

    <div class="card p-6">
        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label for="{{ form.reason.id_for_label }}" class="label">دلیل مرجوعی</label>
                {{ form.reason }}
            </div>

            <div class="flex gap-3 pt-4">
                <button type="submit" class="btn-primary">ارسال درخواست</button>
                <a href="{% url 'storefront:order_list' %}" class="btn-secondary">انصراف</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
