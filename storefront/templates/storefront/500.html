{% extends 'storefront/layouts/store.html' %}

{% block title %}خطای سرور — فروشگاه{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="text-center max-w-md">
        <div class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-red-100">
            <svg class="h-12 w-12 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-stone-900">خطای سرور</h1>
        <p class="mt-3 text-stone-600 leading-relaxed">
            متأسفیم، خطایی در سرور رخ داده است. تیم فنی ما در حال بررسی است.
            لطفاً چند دقیقه دیگر دوباره تلاش کنید.
        </p>
        <div class="mt-8 flex items-center justify-center gap-3">
            <a href="{% url 'storefront:home' %}" class="btn-primary">بازگشت به خانه</a>
            <button onclick="location.reload()" class="btn-outline">تلاش مجدد</button>
        </div>
    </div>
</div>
{% endblock %}
