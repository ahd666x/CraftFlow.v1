{# Shared Stepper Component #}
{# Usage: include this partial with step variable (1, 2, or 3) #}
{# ms-2 / start-1/2: منطقی (مبتنی بر جهت) — ml-2 و left-1/2 در RTL برعکس می‌شد #}
<nav class="mb-8" aria-label="مراحل تسویه">
    <ol class="flex items-center" role="list">
        <li class="flex items-center">
            <span class="flex items-center justify-center w-10 h-10 rounded-full {% if step >= 1 %}bg-primary-600 text-white{% else %}border-2 border-stone-200 bg-white text-stone-500{% endif %} text-sm font-medium"
                  aria-current="{% if step == 1 %}step{% endif %}">
                ۱
            </span>
            <span class="ms-2 hidden sm:inline font-medium {% if step >= 1 %}text-stone-900{% else %}text-stone-500{% endif %}">اطلاعات</span>
        </li>
        <li class="relative flex-1 flex items-center">
            <span class="absolute inset-y-0 start-1/2 w-full h-0.5 {% if step >= 2 %}bg-primary-600{% else %}bg-stone-200{% endif %}" aria-hidden="true"></span>
            <span class="relative flex items-center justify-center w-10 h-10 rounded-full border-2 {% if step >= 2 %}border-primary-600 bg-primary-600 text-white{% else %}border-stone-200 bg-white text-stone-500{% endif %} text-sm font-medium">
                ۲
            </span>
            <span class="ms-2 hidden sm:inline {% if step >= 2 %}text-stone-900{% else %}text-stone-500{% endif %}">پرداخت</span>
        </li>
        <li class="relative flex-1 flex items-center">
            <span class="absolute inset-y-0 start-1/2 w-full h-0.5 {% if step >= 3 %}bg-primary-600{% else %}bg-stone-200{% endif %}" aria-hidden="true"></span>
            <span class="relative flex items-center justify-center w-10 h-10 rounded-full border-2 {% if step >= 3 %}border-primary-600 bg-primary-600 text-white{% else %}border-stone-200 bg-white text-stone-500{% endif %} text-sm font-medium">
                ۳
            </span>
            <span class="ms-2 hidden sm:inline {% if step >= 3 %}text-stone-900{% else %}text-stone-500{% endif %}">تایید</span>
        </li>
    </ol>
</nav>
