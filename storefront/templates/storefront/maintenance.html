{% extends 'storefront/layouts/store.html' %}

{% block title %}در حالت تعمیرات — فروشگاه{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="text-center max-w-md">
        <div class="mx-auto mb-6 flex h-24 w-24 items-center justify-center rounded-full bg-primary-100">
            <svg class="h-12 w-12 text-primary-600 animate-spin" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"/>
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-stone-900">سایت در حال تعمیرات است</h1>
        <p class="mt-4 text-stone-600 leading-relaxed">
            ما در حال به‌روزرسانی و بهبود سایت هستیم تا تجربه بهتری برای شما فراهم کنیم.
            لطفاً کمی بعد مراجعه کنید.
        </p>
        <div class="mt-8 flex items-center justify-center gap-4 text-sm text-stone-500">
            <span class="flex items-center gap-1">
                <svg class="h-5 w-5 animate-pulse text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                زمان تقریبی: چند ساعت
            </span>
        </div>
    </div>
</div>
{% endblock %}
