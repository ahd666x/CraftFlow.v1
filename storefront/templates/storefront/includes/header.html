{% load static %}
<header class="sticky top-0 z-sticky border-b border-stone-100 bg-white/80 backdrop-blur"
        x-data="{ open: false }">
    <div class="mx-auto flex h-16 max-w-6xl items-center gap-6 px-4">

        <a href="{% url 'storefront:home' %}" class="flex items-center gap-2">
            <img src="{% static 'storefront/img/logo.png' %}" alt="لوگو" class="h-8 w-auto">
        </a>

        <nav class="hidden items-center gap-6 md:flex">
            <a href="{% url 'storefront:product_list' %}" class="link-muted">محصولات</a>
            <a href="{% url 'storefront:category_list' %}" class="link-muted">دسته‌بندی‌ها</a>
            {% if user.is_authenticated %}
            <a href="{% url 'storefront:order_list' %}" class="link-muted">سفارش‌ها</a>
            {% endif %}
        </nav>

        <form action="{% url 'storefront:product_list' %}" method="get"
              class="mr-auto hidden w-64 sm:block">
            <input type="search" name="q" value="{{ q }}" placeholder="جستجو…"
                   class="input border-transparent bg-stone-100 py-2 focus:bg-white">
        </form>

        <div class="mr-auto flex items-center gap-1 sm:mr-0">
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}" class="btn-sm text-stone-600 hover:bg-stone-100">حساب من</a>
            {% else %}
                <a href="{% url 'accounts:login' %}" class="btn-sm text-stone-600 hover:bg-stone-100">ورود</a>
            {% endif %}

            <a href="{% url 'cart:cart_detail' %}" class="relative btn-sm text-stone-900 hover:bg-stone-100"
               aria-label="سبد خرید">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z"/>
                </svg>
                <span id="cart-count"
                      class="absolute -top-1 -left-1 grid h-4 min-w-[1rem] place-items-center rounded-full bg-stone-900 px-1 text-[10px] text-white">{{ cart_total_items|default:0 }}</span>
            </a>

            <button type="button" @click="open = !open" class="btn-sm md:hidden" aria-label="منو">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                    <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </div>

    <div x-show="open" x-cloak x-transition.opacity class="border-t border-stone-100 bg-white md:hidden">
        <div class="space-y-1 px-4 py-3 text-sm">
            <a href="{% url 'storefront:product_list' %}" class="block py-2 text-stone-700">محصولات</a>
            <a href="{% url 'storefront:category_list' %}" class="block py-2 text-stone-700">دسته‌بندی‌ها</a>
            {% if user.is_authenticated %}
            <a href="{% url 'storefront:order_list' %}" class="block py-2 text-stone-700">سفارش‌ها</a>
            {% endif %}
        </div>
    </div>
</header>
