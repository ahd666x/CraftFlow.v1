{% extends 'storefront/layouts/store.html' %}

{% block title %}خطا در پرداخت — فروشگاه{% endblock %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-8">
    <div class="card p-8 text-center">
        <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-red-100">
            <svg class="h-8 w-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </div>
        <h2 class="mb-2 text-xl font-bold">خطا در پرداخت</h2>
        <p class="mb-6 text-sm text-stone-500">{{ error }}</p>
        <div class="flex flex-col gap-3 sm:flex-row">
            <a href="{% url 'cart:cart_detail' %}" class="btn-primary flex-1">بازگشت به سبد خرید</a>
            <a href="{% url 'storefront:order_list' %}" class="btn-secondary flex-1">سفارش‌های من</a>
        </div>
    </div>
</div>
{% endblock %}
