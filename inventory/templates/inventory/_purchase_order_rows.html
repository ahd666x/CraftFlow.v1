{% load product_filters %}
{% for order in orders %}
<tr data-id="{{ order.id }}">
    <td>{{ order.id }}</td>
    <td>{{ order.supplier.name }}</td>
    <td>{{ order.created_at|persian_date }}</td>
    <td>
        <span class="badge bg-{% if order.status == 'received' %}success{% elif order.status == 'ordered' %}warning{% else %}secondary{% endif %}">
            {{ order.get_status_display }}
        </span>
    </td>
    <td>{{ order.items.count }}</td>
    <td>
        <button class="btn btn-sm btn-outline-primary edit-po" data-id="{{ order.id }}" data-name="{{ order.supplier.name }}">
            <i class="bi bi-pencil"></i>
        </button>
        <button class="btn btn-sm btn-outline-info view-po-items" data-id="{{ order.id }}">
            <i class="bi bi-list-ul"></i>
        </button>
        {% if order.status != 'received' %}
        <button class="btn btn-sm btn-outline-danger delete-po" data-id="{{ order.id }}" data-name="{{ order.supplier.name }}">
            <i class="bi bi-trash"></i>
        </button>
        {% endif %}
    </td>
</tr>
{% empty %}
<tr><td colspan="6" class="text-center py-4 text-muted">هیچ سفارش خریدی یافت نشد</td></tr>
{% endfor %}
