{# استایل مشترک همه‌ی صفحه‌های اپ دستورالعمل‌ها — روشن، کم‌رنگ، راست‌به‌چپ #}
{% load static %}
<style>
  /* وزیرمتن از static خود پروژه — بدون CDN */
  @font-face { font-family: "Vazirmatn"; src: url("{% static 'selvi/fonts/Vazirmatn-Regular.woff2' %}") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Vazirmatn"; src: url("{% static 'selvi/fonts/Vazirmatn-SemiBold.woff2' %}") format("woff2"); font-weight: 600; font-display: swap; }
  @font-face { font-family: "Vazirmatn"; src: url("{% static 'selvi/fonts/Vazirmatn-Bold.woff2' %}") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Vazirmatn"; src: url("{% static 'selvi/fonts/Vazirmatn-ExtraBold.woff2' %}") format("woff2"); font-weight: 800; font-display: swap; }
  :root {
    --ink: #1b2430; --muted: #6b7686; --line: #e3e7ec; --ground: #f5f6f8; --paper: #fff;
    --accent: #2457d6; --accent-soft: #eef3fe;
    --danger: #c0362c; --danger-soft: #fdf1f0;
    --k-step: #2457d6; --k-note: #8793a5; --k-warning: #c0362c; --k-checklist: #1f8a55; --k-spec: #0d7fa5;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.85 "Vazirmatn", "Vazir", "IRANSans", system-ui, "Segoe UI", Tahoma, sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  bdi, .ltr { unicode-bidi: isolate; }
  .ltr { direction: ltr; display: inline-block; }
  .page { max-width: 860px; margin: 0 auto; padding: 20px 16px 64px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* دکمه‌ها */
  .btn { font: inherit; font-size: 13px; line-height: 1.6; cursor: pointer; padding: 5px 14px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--paper); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--ground); text-decoration: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(.94); }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 2px 10px; font-size: 12px; }
  .btn[disabled] { opacity: .5; cursor: default; }

  /* نوار ابزار */
  .toolbar { position: sticky; top: 0; z-index: 5; background: rgba(245,246,248,.94); backdrop-filter: blur(6px);
    padding: 10px 0; margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); }
  .toolbar .grow { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: inherit; font-size: 12.5px; cursor: pointer; padding: 2px 11px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
  .chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--k, var(--k-note)); }
  .chip .n { color: var(--muted); font-size: 11.5px; }
  .chip.off { color: var(--muted); background: transparent; border-style: dashed; text-decoration: line-through; }
  .chip.off::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .chip[data-kind-chip="step"] { --k: var(--k-step); } .chip[data-kind-chip="note"] { --k: var(--k-note); }
  .chip[data-kind-chip="warning"] { --k: var(--k-warning); } .chip[data-kind-chip="checklist"] { --k: var(--k-checklist); }
  .chip[data-kind-chip="spec"] { --k: var(--k-spec); }

  /* سربرگ سند */
  .doc-head { display: flex; gap: 14px; align-items: center; padding: 18px 0 14px; }
  .doc-head .cover { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--line); }
  .doc-head h1 { font-size: 21px; line-height: 1.5; margin: 0; font-weight: 800; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 12.5px; }
  .meta b { color: var(--ink); font-weight: 600; }

  /* ایستگاه */
  section.station { margin-top: 26px; }
  section.station > h2 { font-size: 14px; font-weight: 800; margin: 0 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
    break-after: avoid; }
  .is-hidden { display: none !important; }

  /* کارت دستورالعمل */
  .ins { --k: var(--k-note); background: var(--paper); border: 1px solid var(--line); border-right: 3px solid var(--k);
    border-radius: var(--radius); margin-bottom: 8px; break-inside: avoid; }
  .ins[data-kind="step"] { --k: var(--k-step); } .ins[data-kind="warning"] { --k: var(--k-warning); background: var(--danger-soft); }
  .ins[data-kind="checklist"] { --k: var(--k-checklist); } .ins[data-kind="spec"] { --k: var(--k-spec); }
  .ins-head { display: flex; align-items: center; gap: 10px; padding: 8px 14px; flex-wrap: wrap; }
  .ins-head[role="button"] { cursor: pointer; }
  .ins-head .tag { font-size: 12px; font-weight: 700; color: var(--k); }
  .ins-head .title { font-weight: 700; }
  .ins-head .cond { font-size: 12px; color: var(--muted); }
  .ins-head .spacer { flex: 1; }
  .ins-head .chev { color: var(--muted); font-size: 11px; transition: transform .15s; }
  .ins.collapsed .chev { transform: rotate(90deg); }
  .ins-body { padding: 0 14px 10px; }
  .ins.collapsed .ins-body { display: none; }
  .line { display: flex; gap: 8px; }
  .line .mark { color: var(--muted); flex: none; width: 1em; text-align: center; }
  .imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 8px; }
  .imgs figure { margin: 0; }
  .imgs img { display: block; width: 100%; max-height: 230px; object-fit: contain; background: var(--ground); border-radius: 6px; border: 1px solid var(--line); }
  .imgs figcaption { font-size: 12px; color: var(--muted); text-align: center; padding-top: 2px; }

  /* جدول */
  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
  table.grid { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.grid th { text-align: right; font-weight: 600; font-size: 12px; color: var(--muted); background: var(--ground); padding: 6px 12px; white-space: nowrap; }
  table.grid td { padding: 6px 12px; border-top: 1px solid var(--line); vertical-align: top; }
  table.grid .num { text-align: right; white-space: nowrap; }
  .route { color: var(--muted); font-size: 12.5px; }

  .empty { color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); padding: 16px; text-align: center; background: var(--paper); }
  .hint { color: var(--muted); font-size: 12px; }

  /* راهنمای خودکار CNC */
  .cnc-auto { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; break-inside: avoid; }
  .cnc-auto > b { font-size: 13.5px; }
  .cnc-auto .sub { font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 4px; }
  .cnc-auto table.grid th { background: transparent; }
  .opline { display: flex; gap: 8px; }
  .cnc-map-wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .cnc-map { position: relative; width: 230px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); flex: none; }
  .cnc-map .pt { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--danger); border: 2px solid #fff; box-shadow: 0 0 0 1px var(--danger); transform: translate(-50%, -50%); }
  .cnc-map .pt span { position: absolute; top: -17px; right: -6px; font-size: 10px; color: var(--danger); font-weight: 800; white-space: nowrap; }
  .cnc-map .org { position: absolute; width: 10px; height: 10px; transform: translate(-50%, -50%); }
  .cnc-map .org::before, .cnc-map .org::after { content: ''; position: absolute; background: var(--accent); }
  .cnc-map .org::before { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
  .cnc-map .org::after { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
  .cnc-map .org span { position: absolute; top: 12px; left: -30px; font-size: 10px; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .cnc-map-legend { font-size: 12px; color: var(--muted); max-width: 300px; }

  /* آیتم سفارش */
  .item-block { margin-top: 28px; padding-top: 4px; border-top: 2px solid var(--ink); }
  .item-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 10px 0 0; }
  .item-head h3 { font-size: 16px; margin: 0; font-weight: 800; }

  @media (max-width: 560px) { .doc-head h1 { font-size: 18px; } .cnc-map { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @page { size: A4; margin: 14mm; }
  @media print {
    body { background: #fff; font-size: 12px; line-height: 1.7; }
    .page { max-width: none; padding: 0; }
    .toolbar, .no-print, .chev { display: none !important; }
    .ins, .cnc-auto, .table-wrap { border-color: #cfd5dc; }
    .ins.collapsed .ins-body { display: block; }
    .ins[data-kind="warning"] { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .item-block { break-before: auto; }
    table.grid th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
