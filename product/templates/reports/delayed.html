{% extends 'base.html' %}

{% block content %}

<h3>سفارش‌های تاخیری</h3>

<table class="table table-bordered">
<tr>
    <th>شماره</th>
    <th>مشتری</th>
</tr>

{% for o in orders %}
<tr>
    <td>{{ o.id }}</td>
    <td>{{ o.customer.name }}</td>
</tr>
{% empty %}
<tr>
    <td colspan="2">موردی نیست</td>
</tr>
{% endfor %}

</table>

{% endblock %}
