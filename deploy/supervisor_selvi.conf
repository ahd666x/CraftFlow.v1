# برنامهٔ selvi برای supervisor — کپی به /etc/supervisor/conf.d/selvi.conf
# سپس: supervisorctl reread && supervisorctl update
#
# نکته‌ها:
# - نام برنامه همان «selvi» است؛ فایل قدیمی conf.d که به /root/selvi اشاره
#   می‌کرد باید حذف/جایگزین شود تا دو برنامهٔ هم‌نام نباشد.
# - پورت bind باید همان پورتی باشد که nginx در proxy_pass می‌دهد.
# - SELVI_DATA_DIR مسیر دادهٔ پروژه است؛ هر اجرای دستی manage.py هم باید
#   همین export را داشته باشد — به‌طور عادی فقط deploy.sh را اجرا کنید.
[program:selvi]
command=/srv/selvi/venv/bin/gunicorn selvi.wsgi:application --workers 3 --bind 127.0.0.1:8000
directory=/srv/selvi/app
user=www-data
autostart=true
autorestart=true
environment=SCAN_BASE_URL="https://selvichoob.ir",SELVI_DATA_DIR="/srv/selvi/shared"
stderr_logfile=/var/log/selvi.err.log
stdout_logfile=/var/log/selvi.out.log
