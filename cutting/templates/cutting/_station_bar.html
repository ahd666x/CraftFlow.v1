{% load static %}
<link rel="stylesheet" href="{% static 'cutting/cutting.css' %}">
<nav class="cutting-nav" aria-label="ایستگاه برش">
  {% if can_operate %}<a class="nav-item" {% if cut_section == 'cut' %}aria-current="page"{% endif %} href="{% url 'cutting:planner' %}">برش</a>{% endif %}
  {% if can_inventory %}
    <a class="nav-item" {% if cut_section == 'stock' or cut_section == 'history' %}aria-current="page"{% endif %} href="{% url 'cutting:inventory' %}">انبار</a>
    <a class="nav-item" {% if cut_section == 'settings' %}aria-current="page"{% endif %} href="{% url 'cutting:size_specs' %}">تنظیمات</a>
  {% endif %}
  {% if can_operate or can_manage %}
    <a class="nav-item" {% if cut_section == 'cnc' %}aria-current="page"{% endif %} href="{% url 'cnc_resizer:sheet_plans' %}">خروجی ورق CNC</a>
    <a class="nav-item" {% if cut_section == 'cnc-manual' %}aria-current="page"{% endif %} href="{% url 'cnc_resizer:manual_queue' %}">صف دستی</a>
  {% endif %}
  <a class="nav-user" href="{% url 'dashboard' %}" title="داشبورد"><i class="bi bi-person-circle" aria-hidden="true"></i><span>{{ user.get_username }}</span></a>
</nav>
